openapi: 3.0.0
info:
  title: Sasya API
  description: Backend API for Sasya Farming Assistant
  version: 1.0.0
servers:
  - url: http://localhost:3001
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      summary: Health Check
      responses:
        '200':
          description: OK
  /api/auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Success
  /api/disease/predict:
    post:
      summary: Upload plant image for disease prediction
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                cropName:
                  type: string
      responses:
        '201':
          description: Created
